image: nixos/nix

stages:
  - setup
  - test
  - build
  - publish

cache:
  paths:
    - /nix/store
    - venv/
    - dist/

before_script:
  - nix-shell

env setup:
  stage: setup
  script:
    - nix-shell --run 'make install'

lint:
  stage: test
  needs:
    - env setup
  script:
    - nix-shell --run 'make lint'

tests and coverage:
  stage: test
  needs:
    - env setup
  script:
    - nix-shell --run 'make coverage'
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d\.]+)%/'

build distribution files:
  stage: build
  needs:
    - lint
    - tests and coverage
  script:
    - nix-shell --run 'make dist'
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz

publish on pypi:
  stage: publish
  needs:
    - build distribution files
  only:
    - tags
  script:
    - nix-shell --run 'twine upload --non-interactive --disable-progress-bar -r testpypi -u __token__ -p "$PYPI_TOKEN" dist/*'
