image: nixos/nix

stages:
  - setup
  - test
  - build
  - publish

cache:
  paths:
    - /nix/store
    - venv/
    - dist/

before_script:
  - mkdir -p ~/.config/nix
  - echo 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf

env setup:
  stage: setup
  script:
    - nix develop --command bash -c 'make install'

lint:
  stage: test
  needs:
    - env setup
  script:
    # oddly the python pre-commit hook doesn't actually install things during
    # install here's a hack to force ruff into the pre-commit cache (works but
    # is not great)
    - nix develop --command bash -c 'pre-commit run'
    # pre-commits output is a bit verbose when it succeeds, choose your own
    # output wrangling
    - nix develop --command bash -c 'patch=$(autoPatchelf ~/.cache/pre-commit/); if [[ $? -ne 0 ]]; then echo "$patch"; exit 1; else echo "patched ~/.cache/pre-commit"; fi'
    # run linter
    - nix develop --command bash -c 'make lint'

tests and coverage:
  stage: test
  needs:
    - env setup
  script:
    - nix develop --command bash -c 'make coverage'
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d\.]+)%/'

build distribution files:
  stage: build
  needs:
    - lint
    - tests and coverage
  script:
    - nix develop --command bash -c 'make dist'
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz

publish on pypi:
  stage: publish
  needs:
    - build distribution files
  only:
    - tags
  script:
    - nix develop --command bash -c 'twine upload --non-interactive --disable-progress-bar -r testpypi -u __token__ -p "$PYPI_TOKEN" dist/*'
