# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=13000']
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: name-tests-test
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.284
    hooks:
      - id: ruff
        files: '.py$'
        args: ['--exclude', 'stubs/*']
  - repo: https://github.com/mrtazz/checkmake.git
    rev: 0.2.2
    hooks:
      - id: checkmake
  - repo: local
    hooks:
      - id: gimtoc
        name: gimtoc
        entry: gimtoc
        language: node
        files: README.md
        args: ["--file", "README.md", "--section", "Table of Contents", "--output", "README.md"]
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        files: '\.py$'
        args:
          - "-rn" # Only display messages
          - "--errors-only"
          - "--ignore-paths=tests,.vscode,.gitlab"
